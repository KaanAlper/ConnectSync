name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Set version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          sed -i '/^\[package\]/,/^\[/ s/^version = .*/version = "'"$VERSION"'"/' Cargo.toml

      - name: Build Release
        run: cargo build --release

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/connect_sync dist/ConnectSync-Linux
          cd dist
          sha256sum ConnectSync-Linux > ConnectSync-Linux.sha256

      - name: Upload Linux to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ConnectSync v1.0.${{ github.run_number }}
          files: |
            dist/ConnectSync-Linux
            dist/ConnectSync-Linux.sha256
          generate_release_notes: true
          make_latest: "true"

  build-windows:
    name: Build Windows & Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure client_secret.json exists
        shell: bash
        run: |
          if [ ! -f client_secret.json ] && [ -n "${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}' > client_secret.json
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set version
        id: v
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          sed -i '/^\[package\]/,/^\[/ s/^version = .*/version = "'"$VERSION"'"/' Cargo.toml
          echo "ver=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: cargo build --release

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ steps.v.outputs.ver }} installer\installer.nsi

      - name: Prepare Windows Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/connect_sync.exe dist/ConnectSync-Windows-Portable.exe
          cp installer/ConnectSync-Setup-${{ steps.v.outputs.ver }}.exe dist/ConnectSync-Windows-Setup.exe
          cd dist
          sha256sum ConnectSync-Windows-Setup.exe > ConnectSync-Windows-Setup.exe.sha256
          sha256sum ConnectSync-Windows-Portable.exe > ConnectSync-Windows-Portable.exe.sha256

      - name: Upload Windows to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ConnectSync v1.0.${{ github.run_number }}
          files: |
            dist/ConnectSync-Windows-Setup.exe
            dist/ConnectSync-Windows-Setup.exe.sha256
            dist/ConnectSync-Windows-Portable.exe
            dist/ConnectSync-Windows-Portable.exe.sha256
          generate_release_notes: true
          make_latest: "true"
