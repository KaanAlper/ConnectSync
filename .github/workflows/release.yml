name: Release

# Actions > Release > Run workflow. Sürüm, son sürümden bu yana gelen commit'lerden hesaplanır
# (semantic versioning, Logical Lunge ile aynı kural): "feat:" -> MINOR, "fix:" / "perf:" / diğerleri -> PATCH,
# tipten sonra "!" ya da "BREAKING CHANGE: <açıklama>" alt satırı -> MAJOR. "bump" ile seviye elle seçilebilir.
# Daha önce kullanılmış bir etiket (başarısız denemeler dahil) asla yeniden kullanılmaz.
# Varlık adları uygulama içi güncelleyicinin (src/updater.rs), install.sh'in ve install.ps1'in aradığı adlardır.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version step: auto reads the commits (feat: minor, fix: patch, type!: or BREAKING CHANGE: major)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
        required: true
      notes:
        description: "Release notes (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the next version
        id: v
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          $m = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^\[package\][^\[]*?^version\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $m.Success) { throw 'version not found in Cargo.toml' }
          $tags = @(git tag --list 'v*')
          $last = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } -Descending | Select-Object -First 1
          $commits = @()
          if ($last) { $commits = @((git log "$last..HEAD" --format='%s%n%b%x1e') -join "`n" -split [char]0x1e) }
          $ver = & ./tools/release-version.ps1 -BaseVersion $m.Groups[1].Value -Tags $tags -Commits $commits -Bump $env:BUMP
          Write-Host "Last release: $last, step: $env:BUMP -> $ver"
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the OAuth client file
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          # include_bytes! needs it; the repository does not carry it
          if [ ! -f client_secret.json ]; then
            if [ -z "$GOOGLE_CLIENT_SECRET_JSON" ]; then
              echo "::error::The GOOGLE_CLIENT_SECRET_JSON secret is missing"
              exit 1
            fi
            printf '%s' "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
          fi
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.ver }}"
          sed -i '/^\[package\]/,/^\[/ s/^version = .*/version = "'"$VERSION"'"/' Cargo.toml

      - name: Build Release
        run: cargo build --release

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/connect_sync dist/ConnectSync-Linux
          cd dist
          sha256sum ConnectSync-Linux > ConnectSync-Linux.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          retention-days: 3

  build-windows:
    name: Build Windows & Installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Write the OAuth client file
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          # include_bytes! needs it; the repository does not carry it
          if [ ! -f client_secret.json ]; then
            if [ -z "$GOOGLE_CLIENT_SECRET_JSON" ]; then
              echo "::error::The GOOGLE_CLIENT_SECRET_JSON secret is missing"
              exit 1
            fi
            printf '%s' "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.ver }}"
          sed -i '/^\[package\]/,/^\[/ s/^version = .*/version = "'"$VERSION"'"/' Cargo.toml

      - name: Build Release
        run: cargo build --release

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ needs.version.outputs.ver }} installer\installer.nsi
          if ($LASTEXITCODE) { throw "makensis exit $LASTEXITCODE" }

      - name: Prepare Windows Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/connect_sync.exe dist/ConnectSync-Windows-Portable.exe
          cp installer/ConnectSync-Setup-${{ needs.version.outputs.ver }}.exe dist/ConnectSync-Windows-Setup.exe
          cd dist
          sha256sum ConnectSync-Windows-Setup.exe > ConnectSync-Windows-Setup.exe.sha256
          sha256sum ConnectSync-Windows-Portable.exe > ConnectSync-Windows-Portable.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          retention-days: 3

  build-setup:
    name: Setup app (x64 / x86)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Build the windowed setup app
        shell: pwsh
        run: ./installer/gui/build.ps1 -Out dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-setup
          path: |
            dist/ConnectSync-Setup-x64.exe
            dist/ConnectSync-Setup-x64.exe.sha256
            dist/ConnectSync-Setup-x86.exe
            dist/ConnectSync-Setup-x86.exe.sha256
          retention-days: 3

  publish:
    name: Publish
    needs: [version, build-linux, build-windows, build-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.ver }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: ConnectSync v${{ needs.version.outputs.ver }}
          body: ${{ inputs.notes }}
          files: |
            dist/ConnectSync-Linux
            dist/ConnectSync-Linux.sha256
            dist/ConnectSync-Windows-Setup.exe
            dist/ConnectSync-Windows-Setup.exe.sha256
            dist/ConnectSync-Windows-Portable.exe
            dist/ConnectSync-Windows-Portable.exe.sha256
            dist/ConnectSync-Setup-x64.exe
            dist/ConnectSync-Setup-x64.exe.sha256
            dist/ConnectSync-Setup-x86.exe
            dist/ConnectSync-Setup-x86.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          make_latest: "true"
