name: Build

# Her push / PR: Linux ve Windows derlemesi, NSIS kurulum programı ve install.ps1'in
# kur / kaldır denemesi. Yayımlamaz; sürüm çıkarmak için: Actions > Release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the OAuth client file
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          # include_bytes! needs it; the repository does not carry it
          if [ ! -f client_secret.json ]; then
            if [ -z "$GOOGLE_CLIENT_SECRET_JSON" ]; then
              echo "::error::The GOOGLE_CLIENT_SECRET_JSON secret is missing"
              exit 1
            fi
            printf '%s' "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Build Release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ConnectSync-Linux
          path: target/release/connect_sync
          retention-days: 7

  build-windows:
    name: Build Windows & Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the OAuth client file
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          # include_bytes! needs it; the repository does not carry it
          if [ ! -f client_secret.json ]; then
            if [ -z "$GOOGLE_CLIENT_SECRET_JSON" ]; then
              echo "::error::The GOOGLE_CLIENT_SECRET_JSON secret is missing"
              exit 1
            fi
            printf '%s' "$GOOGLE_CLIENT_SECRET_JSON" > client_secret.json
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^\[package\][^\[]*?^version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw 'version not found in Cargo.toml' }
          "ver=$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ steps.v.outputs.ver }} installer\installer.nsi
          if ($LASTEXITCODE) { throw "makensis exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/connect_sync.exe dist/ConnectSync-Windows-Portable.exe
          Copy-Item installer/ConnectSync-Setup-${{ steps.v.outputs.ver }}.exe dist/ConnectSync-Windows-Setup.exe

      - name: install.ps1 - install, reinstall, uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ConnectSync'
          $env:CONNECTSYNC_SOURCE = (Resolve-Path 'dist/ConnectSync-Windows-Setup.exe').Path
          $env:CONNECTSYNC_DEFAULTS = '1'
          ./install.ps1
          $p = Get-ItemProperty $key
          if ($p.DisplayVersion -ne '${{ steps.v.outputs.ver }}') { throw "wrong version in Apps: $($p.DisplayVersion)" }
          if (-not (Test-Path (Join-Path $p.InstallLocation 'connect_sync.exe'))) { throw 'exe missing' }
          ./install.ps1
          if (-not (Test-Path $key)) { throw 'reinstall lost the Apps entry' }
          $env:CONNECTSYNC_UNINSTALL = '1'
          ./install.ps1
          if (Test-Path $key) { throw 'uninstall left the Apps entry' }
          if (Test-Path (Join-Path $p.InstallLocation 'connect_sync.exe')) { throw 'uninstall left the exe' }
          'install / reinstall / uninstall ok'

      # The windowed setup app (installer/gui): builds both exes, draws every page and proves it starts and talks to install.ps1
      - name: Setup app - build x64 / x86, draw the pages, run install.ps1's uninstall through the window
        shell: pwsh
        run: |
          ./installer/gui/build.ps1 -Out dist -Shots -Smoke uninstall

      - uses: actions/upload-artifact@v4
        with:
          name: ConnectSync-Windows
          path: dist/*
          retention-days: 7
