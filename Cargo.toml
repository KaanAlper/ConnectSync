[package]
name = "connect_sync"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["crates/connectsync-core", "crates/connectsync-mobile"]
resolver = "3"

# Çekirdek ve uygulama crate'lerinin ortak kullandığı bağımlılıklar: sürümler TEK yerde.
[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
bincode = "1.3.3"
chrono = "0.4.45"
fastcdc = "5.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"

[dependencies]
connectsync-core = { path = "crates/connectsync-core" }
aes-gcm.workspace = true
argon2.workspace = true
auto-launch = "0.6.0"
directories = "6.0.0"
fastcdc.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
hkdf.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-debouncer-full = "0.7.0"
reqwest.workspace = true
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slint = "1.18.0"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tray-icon = "0.25.1"
urlencoding.workspace = true
walkdir.workspace = true
webbrowser = "1.2.4"
yup-oauth2 = "12.1.2"
async-trait = "0.1.92"
bincode.workspace = true
chrono.workspace = true
arboard = "3.6.1"
dirs = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
keyring = { version = "4.2.0", features = ["dbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }

[build-dependencies]
slint-build = "1.18.0"
winres = "0.1.12"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
